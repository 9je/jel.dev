name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The shift board in the dispatch office reads the commit streak out of
      # src/content/streak.json, so it is refreshed into the build context before the image is
      # built. The script keeps the committed snapshot if github.com does not answer.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh the commit streak
        run: node scripts/streak.mjs

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/9je/jel.dev:latest
            ghcr.io/9je/jel.dev:${{ github.sha }}
            ghcr.io/9je/jel.dev:sha-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploys through 9je/infra's bin/deploy on vps.jel.dev: the key can only run "deploy jel-dev".
      # stdin is the image tag, then this run's token (the server pulls with it, then forgets it).
      - name: Deploy to VPS
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          (umask 077; printf '%s\n' "$KEY" > ~/.ssh/deploy)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'sha-%s\n%s\n' "$GITHUB_SHA" "$TOKEN" | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes "deploy@$HOST" "deploy jel-dev"

      - name: Health check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for i in 1 2 3 4 5 6; do
            # --connect-to checks the server deploy just updated, whatever DNS currently says.
            if curl -fsS --connect-to "jel.dev:443:$HOST:443" https://jel.dev/build.txt | grep -qx "$GITHUB_SHA" \
               && curl -fsS --connect-to "jel.dev:443:$HOST:443" https://jel.dev/ | grep -q "Jordan Eldridge Labs"; then echo "live"; exit 0; fi
            sleep 5
          done
          echo "jel.dev did not answer with the deployed build" >&2; exit 1
