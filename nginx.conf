server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

  location ^~ /_astro/ {
    include /etc/nginx/jel-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~* \.(png|jpg|jpeg|webp|svg|woff2|json)$ {
    include /etc/nginx/jel-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
  }

  location = /build.txt {
    include /etc/nginx/jel-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location = /operations { return 301 https://$host/#operations; }
  location = /fabrication { return 301 https://$host/#fabrication; }
  location = /recreation { return 301 https://$host/#recreation; }
  location = /containment { return 301 https://$host/#containment; }
  location = /about { return 301 https://$host/#file; }

  location / {
    include /etc/nginx/jel-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
